<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <div id='box'>
    <!-- 模板语法 -->
    <h1>{{ msg }}</h1>
  </div>

  <!-- 1.引入vue.js -->
  <script src="https://cdn.jsdelivr.net/npm/vue@2.7.16/dist/vue.js"></script>

  <script>
    // 2.创建Vue实例
    const app = new Vue({
      // 指定挂载的元素
      el: '#box',
      // 指定数据对象
      data: {
        msg: 'Hello, Vue!'
      }
    });
  </script>
</body>

</html>
