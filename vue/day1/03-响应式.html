<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <!-- vue核心特性响应式，数据修改视图自动更新 -->
  <div id="app">
    <p>{{ message }}</p>
  </div>

  <script src="./vue.js"></script>

  <script>

    const app = new Vue({
      el: '#app',
      data: {
        message: 'hello vue2'
      }
    })

    // data 中的字段会绑定到 vue 实例上
    setTimeout(() => {
      app.message = 'hello vue3'
    }, 2000)
  </script>

</body>

</html>
