<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="./css/inputnumber.css" />
  <link rel="stylesheet" href="./css/index.css" />
  <title>购物车</title>
</head>

<body>
  <div class="app-container" id="app">
    <!-- 顶部banner -->
    <div class="banner-box"><img src="http://autumnfish.cn/static/fruit.jpg" alt="" /></div>
    <!-- 面包屑 -->
    <div class="breadcrumb">
      <span>🏠</span>
      /
      <span>购物车</span>
    </div>
    <!-- 购物车主体 -->
    <div class="main" v-if="fruitList.length > 0">
      <div class="table">
        <!-- 头部 -->
        <div class="thead">
          <div class="tr">
            <div class="th">选中</div>
            <div class="th th-pic">图片</div>
            <div class="th">单价</div>
            <div class="th num-th">个数</div>
            <div class="th">小计</div>
            <div class="th">操作</div>
          </div>
        </div>
        <!-- 身体 -->
        <div class="tbody">
          <div class="tr" v-bind:class="{active:item.isChecked}" v-for="(item, index) in fruitList" :key="item.id">
            <div class="td"><input type="checkbox" v-model="item.isChecked" /></div>
            <div class="td"><img :src="item.icon" :alt="item.name" /></div>
            <div class="td">{{ item.price }}</div>
            <div class="td">
              <div class="my-input-number">
                <button class="decrease" @click="decrease(item.id)" v-bind:disabled="item.num <= 1"> - </button>
                <span class="my-input__inner">{{ item.num }}</span>
                <button class="increase" @click="increase(item.id)"> + </button>
              </div>
            </div>
            <div class="td">{{ item.price * item.num }}</div>
            <div class="td"><button @click="removeItem(item.id)">删除</button></div>
          </div>
        </div>
      </div>
      <!-- 底部 -->
      <div class="bottom">
        <!-- 全选 -->
        <label class="check-all">
          <input type="checkbox" v-model="isAllChecked">
          全选
        </label>
        <div class="right-box">
          <!-- 所有商品总价 -->
          <span class="price-box">总价&nbsp;&nbsp;:&nbsp;&nbsp;¥&nbsp;<span class="price">{{ totalPrice }}</span></span>
          <!-- 结算按钮 -->
          <button class="pay">结算( {{ totalCount }} )</button>
        </div>
      </div>
    </div>
    <!-- 空车 -->
    <div class="empty" v-else>🛒空空如也</div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/vue@2.6.14/dist/vue.js"></script>
  <script>
    const fruitListFromStorage = localStorage.getItem('fruitList');

    const app = new Vue({
      el: '#app',
      data: {
        // 水果列表
        fruitList: fruitListFromStorage ? JSON.parse(fruitListFromStorage) : [
          {
            id: 1,
            icon: 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSmKl6iQg6SyCWsE6gsFwYooQ3mBspb5tdc4T46p59-VQ&s',
            isChecked: true,
            num: 2,
            price: 6,
          },
          {
            id: 2,
            icon: 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS9OyacDgMQinh8pO15f2zhADz69qAgQWrwptSiDkepNAhOytrsK2yp-_Kd&s=10',
            isChecked: false,
            num: 7,
            price: 20,
          },
          {
            id: 3,
            icon: 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS2q-LjvCjGw58m7k8XtpkjQXKRvGYWnounpA6-_SrdVQ&s=10',
            isChecked: false,
            num: 3,
            price: 40,
          },
          {
            id: 4,
            icon: 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQT9wHvbYkR4Do6syrHvRB-LLgXuwwjzgDCH3YFjThDyA&s=10',
            isChecked: true,
            num: 10,
            price: 3,
          },
          {
            id: 5,
            icon: 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRhS0epPYDD6fVy-Qe8QGZTt1sGcPRZw97RhjQCZexX7w&s=10',
            isChecked: false,
            num: 20,
            price: 34,
          },
        ],
      },
      methods: {
        removeItem(id) {
          this.fruitList = this.fruitList.filter(item => item.id !== id);
        },
        increase(id) {
          const item = this.fruitList.find(item => item.id === id);
          if (item) {
            item.num++;
          }
        },
        decrease(id) {
          const item = this.fruitList.find(item => item.id === id);
          if (item && item.num > 1) {
            item.num--;
          }
        },
      },
      computed: {
        isAllChecked: {
          get() {
            return this.fruitList.every(item => item.isChecked);
          },
          set(value) {
            this.fruitList.forEach(item => {
              item.isChecked = value;
            });
          }
        },
        totalPrice() {
          return this.fruitList.reduce((total, item) => {
            if (item.isChecked) {
              total += item.price * item.num;
            }
            return total;
          }, 0);
        },
        totalCount() {
          return this.fruitList.reduce((count, item) => {
            if (item.isChecked) {
              count += item.num;
            }
            return count;
          }, 0);
        }
      },
      watch: {
        fruitList: {
          handler() {
            console.log('fruitList changed')
            localStorage.setItem('fruitList', JSON.stringify(this.fruitList));
          },
          deep: true
        }
      }
    })
  </script>
</body>

</html>
