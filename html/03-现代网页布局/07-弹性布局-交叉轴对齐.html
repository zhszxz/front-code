<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>弹性布局-容器flex</title>
  <style>
    * {
      margin: 0;
      padding: 0;
    }

    .box {
      display: flex;
      /* 交叉轴的对齐方式 
      flex-start; 顶部对齐
      flex-end; 底部对齐
      center; 居中对齐
      stretch; 拉伸对齐,需要子盒子不设置高度
      */
      align-items: center;
      /* 主轴的对齐方式 */
      justify-content: space-between;
      width: 500px;
      height: 300px;
      border: 1px solid red;
      margin: 20px 0 0 10px;
    }

    .box .item {
      width: 100px;
      height: 100px;
      background-color: pink;
      border-radius: 10px;
    }
  </style>
</head>

<body>
  <div class="box">
    <div class="item">1</div>
    <div class="item">2</div>
    <div class="item">3</div>
    <div class="item">4</div>
  </div>
</body>

</html>
