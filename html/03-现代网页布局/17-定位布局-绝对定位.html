<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>定位布局-绝对定位</title>
  <style>
    .father {
      position: relative;
      width: 400px;
      height: 400px;
      background-color: pink;
      margin: 50px;
    }

    .son1 {
      /* 绝对定位
      元素脱离正常流，不占据空间
      相对于最近的已定位祖先元素移动，若无则相对于视口移动
      left，top优先于right，bottom
      */
      position: absolute;
      top: 120px;
      left: 120px;
      width: 150px;
      height: 150px;
      background-color: skyblue;
    }

    .son2 {
      width: 120px;
      height: 120px;
      background-color: purple;
    }
  </style>
</head>

<body>
  <div class="father">
    <div class="son1">第一个盒子</div>
    <div class="son2">第二个盒子</div>
  </div>
</body>

</html>
