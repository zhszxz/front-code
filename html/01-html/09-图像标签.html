<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>图像标签</title>
</head>

<body>
  <h2>图像标签的基本使用：</h2>
  <!-- 属性
    src： 图像路径
    alt： 图像描述，用于图片无法显示时的替代文本
    width： 图像宽度，与高度设置一个即可，另一个会等比缩放
    height： 图像高度
    title： 图像标题
  -->
  <img src="./img/pig.png" alt="猪爸爸" width="500px" title="猪爸爸">
  <h2>不同格式的图片：</h2>
  <img src="./img/1.jpg" alt="">
  <img src="./img/2.webp" alt="">
  <img src="./img/4.avif" alt="">
  <img src="./img/5.gif" alt="">
</body>

</html>
