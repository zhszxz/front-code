<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>音视频标签</title>
</head>

<body>
  <h2>视频标签</h2>
  <!-- 视频标签属性
    src： 视频路径
    width： 视频宽度
    height： 视频高度
    controls： 显示默认视频控件
    autoplay： 自动播放
    muted： 静音
    loop： 循环播放
    poster： 视频封面
  -->
  <video src="./media/yu7.mp4" width="400" controls="controls"></video>

  <!-- 属性中等于属性名的属性值可以省略 -->
  <video src="./media/yu7.mp4" width="400" controls autoplay muted loop poster="./media/yu7.jpg"></video>

  <!-- 兼容性写法 -->
  <video width="400" controls muted loop poster="./media/yu7.jpg">
    <source src="./media/yu7.mp4" type="video/mp4">
    <p> 您的浏览器不支持mp4视频播放 </p>
  </video>

  <!-- 音频标签属性
    src： 音频路径
    controls： 显示默认音频控件
    autoplay： 自动播放
    muted： 静音
  -->
  <audio src="./media/ldh.mp3" controls muted autoplay></audio>

  <!-- 兼容性写法 -->
  <audio controls>
    <source src="./media/ldh.mp3" type="audio/mp3">
    <p> 您的浏览器不支持音频播放 </p>
  </audio>

</body>

</html>
