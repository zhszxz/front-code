<!DOCTYPE html>

  <title>盒子综合案例-淘宝侧边栏</title>
  <link rel="stylesheet" href="./iconfont1/iconfont.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    a {
      color: #1f1f1f;
      /* 取消下划线 */
      text-decoration: none;
    }

    ol,
    ul {
      /* 取消列表的小圆点 */
      list-style: none;
    }

    .service {
      width: 256px;
      height: 400px;
      background-color: #f7f7f7;
      border-radius: 12px;
      margin: 100px auto;
    }

    .service-title {
      line-height: 32px;
      padding: 8px 0 0 16px;
      font-size: 16px;
      font-weight: 600;
      color: #1f1f1f;
    }

    .service-title img {
      width: 60px;
      height: 20px;
      margin-left: 4px;
    }

    .service-bd li {
      height: 32px;
      line-height: 32px;
      /* background-color: pink; */
      margin: 0 8px;
      border-radius: 4px;
      transition: all .5s;
      padding-left: 10px;
    }

    .service-bd li:first-child,
    .service-bd li:first-child a {
      color: #ff5000;
    }

    .service-bd li i {
      margin-right: 4px;
    }

    .service-bd li:hover {
      background-color: #fff;
    }

    .service-bd li a {
      font-size: 14px;
    }

    .service-bd li a:hover {
      color: #ff5000;
    }
  </style>
</head>
