<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>类型选择器以及注释</title>
  <style>
    div {
      color: pink;
    }

    li {
      color: blue;
    }
  </style>
</head>

<body>
  <!-- 类型选择器 -->
  <div>大春</div>
  <div>夏洛</div>
  <div>秋雅</div>
  <div>冬梅</div>
  <ul>
    <li>猪爸爸</li>
    <li>猪妈妈</li>
    <li>佩奇</li>
    <li>乔治</li>
  </ul>
</body>

</html>
