<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>链接伪类选择器</title>
  <style>
    /* 链接伪类选择器 
     * link 未访问链接
     * visited 已访问链接
     * hover 鼠标悬停链接
     * active 被点击的状态
     */
    a:link {
      color: #000;
      text-decoration: none;
    }

    a:visited {
      color: orange;
      text-decoration: none;
    }

    a:hover {
      color: red;
      text-decoration: underline;
    }

    a:active {
      color: blue;
      text-decoration: none;
    }
  </style>
</head>

<body>
  <a href="https://www.deepseek1.com">deepseek一下</a>
  <a href="#">产品介绍</a>
  <a href="#">联系方式</a>
</body>

</html>
