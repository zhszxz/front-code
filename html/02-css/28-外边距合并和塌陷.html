<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>外边距合并和塌陷</title>
  <style>
    .box1,
    .box2 {
      width: 150px;
      height: 100px;
      background-color: pink;
    }

    /* 1. 外边距合并：两个相邻的外边距会合并 */
    .box1 {
      margin-bottom: 100px;
    }

    .box2 {
      background-color: skyblue;
      margin-top: 50px;
    }

    /* 2. 塌陷：子元素的外边距会导致父元素塌陷 */
    .father {
      width: 150px;
      height: 150px;
      background-color: pink;
      /* 解决方式1：给父元素加边框 */
      /* border: 1px solid #000; */
      /* 解决方式2：用父元素内边距代替子元素外边距 */
      /* padding-top: 1px; */
      /* 解决方式3：给父元素添加 overflow: hidden; */
      overflow: hidden;
    }

    .son {
      width: 80px;
      height: 80px;
      background-color: purple;
      margin-top: 20px;
    }
  </style>
</head>

<body>
  <div class="box1"></div>
  <div class="box2"></div>

  <div class="father">
    <div class="son"></div>
  </div>
</body>

</html>
