<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>类选择器</title>
  <style>
    /* 类选择器 */
    .pink {
      color: pink;
    }

    .sub-nav {
      font-size: 20px;
    }
  </style>
</head>

<body>
  <div class="pink">大春</div>
  <div class="sub-nav">夏洛</div>
  <div class="pink sub-nav">秋雅</div>
  <div>冬梅</div>
</body>

</html>
