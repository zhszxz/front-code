<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>综合案例-小米卡片</title>
  <style>
    /* css初始化 */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #ccc;
    }

    .cart {
      width: 234px;
      height: 300px;
      background-color: #fff;
      margin: 100px auto;
      text-align: center;
      /* 行高 */
      line-height: 25px;

    }

    .cart:hover {
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
    }

    .cart img {
      width: 160px;
      height: 160px;
      margin-top: 20px;
    }

    .cart .name {
      font-size: 14px;
    }

    .cart .desc {
      font-size: 12px;
      color: #999;
      /* 强制文字不换行 */
      white-space: nowrap;
      /* 溢出文字省略 */
      overflow: hidden;
      /* 显示省略号 */
      text-overflow: ellipsis;
    }

    .cart .price {
      font-size: 14px;
      color: #ff4444;
    }

    .cart .origin {
      font-size: 14px;
      color: #999;
      /* 删除线 */
      text-decoration: line-through;
      margin-left: 10px;
    }
  </style>
</head>

<body>
  <div class="cart">
    <img src="./img/mi.webp" alt="">
    <div class="name">Xiaomi Buds 5</div>
    <div class="desc">舒适无感佩戴｜高通全链路无损音频｜哈曼 AudioEFX 联合调音</div>
    <div class="price">659元<span class="origin">699元</span>
    </div>

  </div>
</body>

</html>
