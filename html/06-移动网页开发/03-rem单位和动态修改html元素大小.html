<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>动态修改html元素大小</title>

  <style>
    * {
      margin: 0;
      padding: 0;
    }

    .box {
      /* rem单位：相对于html元素的字体大小，例如谷歌浏览器中html元素的默认字体大小是16px，那么1rem等于16px */
      width: 10rem;
      height: 10rem;
      background-color: pink;
    }
  </style>
</head>

<body>
  <div class="box"></div>
  <!-- <script src="./js/flexible.js"></script> -->
</body>

</html>
