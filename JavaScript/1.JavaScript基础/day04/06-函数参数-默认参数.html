<body>

  <script>
    // 参数默认值
    function getSum(start = 0, end = 100) {
      let sum = 0
      for (let i = start; i <= end; i++) {
        sum += i
      }
      console.log(sum)
    }
    getSum(1, 50)
    getSum(100, 200)
    getSum()
  </script>
</body>
