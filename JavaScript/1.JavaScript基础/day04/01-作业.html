<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>
    // 找出数组中 元素为10的下标，有则打印该下标，没有则打印 -1
    let arr = [88, 20, 10, 100, 50]
    let res = -1
    for (let i = 0; i < arr.length; i++) {
      if (arr[i] === 10) {
        res = i
        break
      }
    }
    console.log(res)

    // 让用户输入五个有效年龄（0 - 100之间），放入数组中
    let ages = []
    while (ages.length < 5) {
      let age = +prompt('请输入年龄')
      if (age >= 0 && age <= 100) {
        ages.push(age)
      } else {
        alert('请输入有效年龄')
      }
    }
    console.log(ages)
  </script>
</body>

</html>
