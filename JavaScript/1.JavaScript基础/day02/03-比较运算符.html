<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>
    // === 严格相等：不做类型转换，类型不同直接返回 false
    1 === 1;          // true
    1 === '1';        // false（类型不同）
    null === undefined; // false
    NaN === NaN;      // false（NaN 不等于任何人，包括他自己）
    +0 === -0;        // true

    // == 松散相等：会做类型转换，同类型直接比，不同类型按规则转
    null == undefined;   // true（特殊规定）
    null == 0;           // false
    undefined == 0;      // false
    null == false;       // false

    1 == '1';       // true
    0 == '';        // true（'' → 0）
    0 == '0';       // true
    '1' == '01';    // false（都是字符串，直接比）

    true == 1;      // true
    true == '1';    // true（true→1，'1'→1）
    false == 0;     // true
    false == '';    // true（false→0，''→0）
    true == 2;      // false

    // 关系比较 > < >= <= ：优先转数字比较；如果双方都是字符串，则按字典序比较
    2 > 1;         // true
    '2' > 1;       // true（'2'→2）
    '2' > '10';    // true（都是字符串，字典序 '2' > '1'）
    2 > '10';      // false（'10'→10）
    true > 0;      // true（true→1）
    null >= 0;     // true（null→0）
    undefined > 0; // false（undefined→NaN，任何和 NaN 比较都是 false）
    'apple' < 'banana';  // true
    '10' < '9';          // true（'1' < '9'）
    'abc' < 'abd';       // true
    'a' < 'A';           // false（小写字母编码更大）
    NaN > 0;      // false
    NaN < 0;      // false
    NaN >= 0;     // false
    NaN <= 0;     // false
    NaN == NaN;   // false
  </script>
</body>

</html>
