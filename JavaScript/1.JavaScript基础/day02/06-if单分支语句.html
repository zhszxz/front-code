<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>
    // 1. 用户输入
    let score = +prompt('请输入成绩')
    // 2. 进行判断输出
    if (score >= 700) {
      alert('恭喜考入黑马程序员')
    }
    console.log('-----------------')


    // if语句条件会转为布尔值，以下的值会被转为false
    if (0) { }         // 不执行
    if ('') { }        // 不执行
    if (null) { }      // 不执行
    if (undefined) { } // 不执行
    if (NaN) { }       // 不执行

    // 以下的值会被转为true
    if ([]) { }        // 执行！空数组是真值
    if ({}) { }        // 执行！空对象是真值
    if ('0') { }       // 执行！非空字符串

  </script>
</body>

</html>
