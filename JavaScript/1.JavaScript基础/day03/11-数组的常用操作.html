<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>
    // 获取数组的长度
    let arr = [1, 2, 3.14, 'Hello', null, true];
    console.log(arr.length); // 6
    console.log('----------------------------');

    // 修改数组的长度
    arr = ['A', 'B', 'C'];
    arr.length = 6;
    console.log(arr); // arr变为['A', 'B', 'C', undefined, undefined, undefined]
    arr.length = 2;
    console.log(arr); // arr变为['A', 'B']
    console.log('----------------------------');

    // 修改数组的元素
    arr = ['A', 'B', 'C'];
    arr[1] = 99;
    console.log(arr); // arr现在变为['A', 99, 'C']
    console.log(arr[1]); // 99
    arr[5] = 'x'; //索引越界会导致数组长度变化
    console.log(arr);
    console.log('----------------------------');

    // indexOf 查找元素索引，不存在返回-1
    arr = [10, 20, '30', 'xyz'];
    console.log(arr.indexOf(10));
    console.log(arr.indexOf(20));
    console.log(arr.indexOf(30)); // 元素30没有找到，返回-1
    console.log(arr.indexOf('30'));
    console.log('----------------------------');

    // slice 切片，截取数组的一部分，返回一个新数组
    arr = ['A', 'B', 'C', 'D', 'E', 'F', 'G'];
    console.log(arr.slice(0, 3)); // 包头不包尾: ['A', 'B', 'C']
    console.log(arr.slice(3)); // 从索引3开始到结束: ['D', 'E', 'F', 'G']
    let aCopy = arr.slice(); // 不传参数会从头到尾截取元素，利用这点可以复制数组
    console.log(aCopy);
    console.log(aCopy === arr); // false
    console.log('----------------------------');

    // push 尾插，pop 尾删
    arr = [1, 2];
    console.log(arr.push('A', 'B')); // 返回Array新的长度: 4
    console.log(arr); // [1, 2, 'A', 'B']
    console.log(arr.pop()); // pop()返回'B'
    console.log(arr); // [1, 2, 'A']
    arr.pop(); arr.pop(); arr.pop(); // 连续pop 3次
    console.log(arr); // []
    arr.pop(); // 空数组继续pop不会报错，而是返回undefined
    console.log(arr); // []
    console.log('----------------------------');

    // unshift 头插，shift 头删
    arr = [1, 2];
    console.log(arr.unshift('A', 'B')); // 返回Array新的长度: 4
    console.log(arr); // ['A', 'B', 1, 2]
    console.log(arr.shift()); // 'A'
    console.log(arr); // ['B', 1, 2]
    arr.shift(); arr.shift(); arr.shift(); // 连续shift 3次
    console.log(arr); // []
    console.log(arr.shift()); // 空数组继续shift不会报错，而是返回undefined
    console.log(arr); // []
    console.log('----------------------------');

    // sort 排序
    arr = ['B', 'C', 'A'];
    arr.sort();
    console.log(arr); // ['A', 'B', 'C']
    console.log('----------------------------');

    //reverse 反转
    arr = ['one', 'two', 'three'];
    arr.reverse();
    console.log(arr); // ['three', 'two', 'one']
    console.log('----------------------------');

    // splice 从指定索引删除若干元素再插入若干元素，返回被删除的元素的数组
    arr = ['Microsoft', 'Apple', 'Yahoo', 'AOL', 'Excite', 'Oracle'];
    console.log(arr.splice(2, 3, 'Google', 'Facebook')); // 返回删除的元素 ['Yahoo', 'AOL', 'Excite']
    console.log(arr); // ['Microsoft', 'Apple', 'Google', 'Facebook', 'Oracle']
    // 只删除,不添加:
    console.log(arr.splice(2, 2));
    console.log(arr); // ['Microsoft', 'Apple', 'Oracle']
    // 只添加,不删除:
    console.log(arr.splice(2, 0, 'Google', 'Facebook'));
    console.log(arr); // ['Microsoft', 'Apple', 'Google', 'Facebook', 'Oracle']
    console.log('----------------------------');

    // concat 合并数组
    arr = ['A', 'B', 'C'];
    let added = arr.concat([1, 2, 3]);
    console.log(added); // ['A', 'B', 'C', 1, 2, 3]
    console.log('----------------------------');

    // join 将数组元素连接成字符串
    arr = ['小明', '小红', '大军', '阿黄'];
    console.log(arr.join('、'));
  </script>
</body>

</html>
