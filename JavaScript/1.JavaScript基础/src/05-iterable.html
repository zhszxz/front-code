<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>
    //Array、Map和Set都属于iterable类型,可以通过新的for ... of循环来遍历
    let a = ['A', 'B', 'C'];
    let s = new Set(['A', 'B', 'C']);
    let m = new Map([[1, 'x'], [2, 'y'], [3, 'z']]);
    for (let x of a) { // 遍历Array
      console.log(x);
    }
    for (let x of s) { // 遍历Set
      console.log(x);
    }
    for (let x of m) { // 遍历Map
      console.log(x[0] + '=' + x[1]);
    }

  </script>
</body>

</html>
