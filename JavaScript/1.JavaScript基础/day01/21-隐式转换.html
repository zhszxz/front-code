<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>
    // 隐式转换由运算符触发，规则可以归结为一句话：运算符决定了目标类型。

    /*
    1. + 运算符（最特殊）
      + 有两种作用：加法 和 字符串拼接。
      规则：只要有一方是字符串，就做字符串拼接；否则做数字加法。
    */
    console.log(1 + 2) //3
    console.log(1 + '2')  // "12"
    console.log('1' + 2)  // "12"
    console.log(1 + true)  // 2（true→1）
    console.log(1 + null)  // 1（null→0）
    console.log(1 + undefined)  // NaN
    console.log(1 + [])  // "1"（[]→""）
    console.log(1 + [2])  // "12"（[2]→"2"）

    /*
    2. 其他算术运算符 - * / %
      这些只做数学运算，会把操作数转成数字：
    */
    console.log('6' - 2)      // 4
    console.log('6' * '2')      // 12
    console.log('6' / '2')      // 3
    console.log(true - 1)      // 0
    console.log([] - 0)      // 0
    console.log([5] - 0)      // 5
  </script>
</body>

</html>
