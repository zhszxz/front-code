<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>
    // js 弱数据类型的语言 只有当我们赋值了，才知道是什么数据类型
    // js中整数和小数都是number类型
    console.log(1 + 1)
    console.log(1 * 1)
    console.log(1 / 1)
    console.log(4 % 2)
    console.log(5 % 3)
    console.log(3 % 5)

    // 不正确或者未定义的数学操作会得到 NaN ，对 NaN 的任何操作都会得到 NaN
    console.log('pink老师' - 2)
    console.log(NaN - 2)
    console.log(NaN + 2)
    console.log(NaN / 2)
    // NaN 不等于任何值，包括它自己
    console.log(NaN === NaN)
  </script>
</body>

</html>
