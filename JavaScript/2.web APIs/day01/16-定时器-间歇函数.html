<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>
    // setInterval(函数, 间隔时间)
    // 返回值：定时器id
    let n = setInterval(function () {
      console.log('一秒执行一次')
    }, 1000)

    // 关闭定时器
    clearInterval(n)

  </script>
</body>

</html>
