<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <div class="box">我是文字的内容</div>

  <script>
    // 获取元素
    const box = document.querySelector('.box')
    // 1. innerText，不会解析标签
    box.innerText = '<strong>我是innerText，我不会解析标签</strong>'

    // 2. innerHTML，会解析标签
    box.innerHTML = '<strong>我是innerHTML，我会解析标签</strong>'
  </script>
</body>

</html>
